[package]
name = "tuxbar"
version = "0.1.0"
edition = "2021"
authors = ["Juan José Monzón <mylnzon58@gmail.com>"]
description = "The Pure & Dynamic Touch Bar Engine for Linux"
license = "GPL-3.0-or-later"

[dependencies]
drm = "0.14"
evdev = "0.12"
nix = { version = "0.29", features = ["mman", "signal"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "4.4"
chrono = "0.4"
fontdue = "0.9"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
